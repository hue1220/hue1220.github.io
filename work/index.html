<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무자료실 · Master Hue의 작업실</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2EC4B6">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../style.css?v=2">
<script>
  window.GATE_HASH = '58f80cb81ed4b05cedac165d4ab30fd9e307d17d0f142ca708dd999ab479b238';
  window.GATE_HINT = '힌트: 꾸꾹';
</script>
<script src="../gate.js?v=2"></script>
<style>
  .file .dl.open { background: #339af0; }
  .file .type.link { background: #e6efff; color: #339af0; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../"><img src="../fox.svg" alt=""> Hue's Lab</a>
</header>

<main>
  <section class="page-title">
    <a class="back" href="../">← 처음으로</a>
    <h1>🗂️ 업무자료실</h1>
    <p>발표 자료와 슬라이드를 열거나 내려받으세요.</p>
  </section>

  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>

<footer><span>© 2026 Master Hue</span></footer>

<script>
  /* 자료 목록은 works.json에서 불러옵니다.
     - 파일(PDF·PPT 등): { "group": "연수", "title": "제목", "file": "files/이름.pdf", "date": "2026-11-11" }
     - 웹 슬라이드·링크:   { "group": "연수", "title": "제목", "link": "slides/이름/", "date": "2026-11-11" } */
  const tabsEl = document.getElementById('tabs');
  const listEl = document.getElementById('list');
  let all = [], current = '전체';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() {
    const items = current === '전체' ? all : all.filter(f => f.group === current);
    if (!items.length) {
      listEl.innerHTML = '<p class="empty">아직 올라온 자료가 없어요.</p>';
      return;
    }
    listEl.innerHTML = items.map(f => {
      const isLink = !!f.link;
      const href = isLink ? f.link : f.file;
      const type = isLink ? '열기' : (f.file.split('.').pop() || '').toUpperCase();
      const attrs = isLink ? 'target="_blank" rel="noopener"' : 'download';
      return `<a class="file" href="${esc(href)}" ${attrs}>
        <span class="type${isLink ? ' link' : ''}">${isLink ? '🖥️' : esc(type)}</span>
        <span class="info">
          <span class="name">${esc(f.title)}</span><br>
          <span class="meta">${esc(f.group)}${f.date ? ' · ' + esc(f.date) : ''}</span>
        </span>
        <span class="dl${isLink ? ' open' : ''}">${isLink ? '열기' : '받기'}</span>
      </a>`;
    }).join('');
  }

  function renderTabs() {
    const groups = ['전체', ...new Set(all.map(f => f.group))];
    tabsEl.innerHTML = groups.map(g =>
      `<button class="${g === current ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
    tabsEl.querySelectorAll('button').forEach(b => b.onclick = () => {
      current = b.dataset.g; renderTabs(); render();
    });
  }

  fetch('works.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => { all = data.slice().reverse(); renderTabs(); render(); })
    .catch(() => { listEl.innerHTML = '<p class="empty">자료 목록을 불러오지 못했어요.</p>'; });
</script>
</body>
</html>
