:root{--ink:#1E2433;--sub:#6B7280;--line:#E3E6EC;--soft:#F5F7FA;--blue:#3D5A80;--star:#F2A93B;--ok:#1F9D6B;--okbg:#E7F6EF;--no:#C2410C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:P,'Malgun Gothic',sans-serif;color:var(--ink)}
.en{font-family:SG,P,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#fff;overflow:hidden}
.slide{position:absolute;inset:0;padding:70px 110px 120px;display:none}
.slide.on{display:block}
.top{display:flex;align-items:center;gap:22px;margin-bottom:46px}
.tag{font-family:SG,P;font-weight:700;font-size:30px;color:#fff;background:var(--blue);border-radius:999px;padding:6px 26px}
.qno{font-family:SG;font-weight:700;font-size:56px;color:var(--blue)}
.stars{font-size:38px;letter-spacing:4px;color:var(--star)}
.stars i{font-style:normal;color:#E1E4EA}
.deco{position:absolute;right:90px;top:60px;opacity:.9}
.stem{font-family:SG,P;font-weight:500;font-size:64px;line-height:1.45;max-width:1650px}
.ctx{font-family:SG,P;font-weight:500;font-size:52px;line-height:1.6;max-width:1700px;background:var(--soft);border-radius:28px;padding:34px 46px}
.blank{display:inline-block;min-width:200px;border-bottom:6px solid var(--ink);text-align:center;font-weight:700;color:var(--sub);font-size:.8em;padding:0 10px;line-height:1.1;transition:.25s}
.blank.fill{color:var(--ok);border-color:var(--ok);font-size:1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px 40px;margin-top:54px;max-width:1700px}
.opts.long{grid-template-columns:1fr;gap:16px}
.opt{font-family:SG,P;font-weight:500;font-size:50px;border:3px solid var(--line);border-radius:22px;padding:16px 30px;transition:.25s;display:flex;gap:22px;align-items:baseline}
.opts.long .opt{font-size:42px;padding:12px 28px}
.opt b{font-weight:700;color:var(--blue)}
.reveal .opt.dim{opacity:.28}
.reveal .opt.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.reveal .opt.ans b{color:var(--ok)}
.exp{display:none;flex-direction:column;gap:16px;margin-top:34px;max-width:1700px}
.explain .exp{display:flex}
.explain .opt.dim{display:none}
.explain .opts{grid-template-columns:1fr;max-width:900px;margin-top:30px}
.explain.ctxs .opts{display:none}
.ex{font-size:44px;line-height:1.45;background:#FFF7E8;border-left:12px solid var(--star);border-radius:16px;padding:18px 32px;opacity:0;transform:translateY(16px);transition:.3s}
.ex.show{opacity:1;transform:none}
.ex b{color:var(--no)}
.ex.memo{background:var(--okbg);border-left-color:var(--ok);font-family:SG,P}
.ex.memo::before{content:"외워 두기  ";font-family:P;font-weight:700;color:var(--ok)}
/* cover / passage / table */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%}
.cover h1{font-size:110px;margin:0 0 30px;letter-spacing:-.02em;line-height:1.15}
.cover p{font-size:46px;color:var(--sub);margin:0}
.hint{position:absolute;left:110px;bottom:110px;font-size:36px;color:var(--sub)}
.key{display:inline-block;border:3px solid var(--line);border-bottom-width:6px;border-radius:12px;padding:0 16px;font-family:SG;font-weight:700;color:var(--ink)}
.pas{font-family:SG,P;font-weight:500;font-size:46px;line-height:1.6;border:3px solid var(--line);border-radius:28px;padding:40px 56px;max-width:1700px}
.pas p{margin:0 0 18px}
.pas .blank{min-width:120px}
h2{font-size:64px;margin:0 0 40px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px}
.cell{border-radius:18px;background:var(--soft);padding:16px 22px;display:flex;align-items:baseline;gap:16px}
.cell span{font-family:SG;font-size:30px;color:var(--sub);font-weight:700}
.cell b{font-family:SG;font-size:50px;color:var(--star)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:20px}
.stp{background:var(--soft);border-radius:28px;padding:40px 44px;font-size:40px;line-height:1.5}
.stp b{display:block;font-size:50px;color:var(--blue);margin-bottom:14px}
.stp.hl{background:#FFF7E8}.stp.hl b{color:var(--star)}
.big{font-size:80px;font-weight:700;text-align:center;margin-top:80px}
.endwrap{display:flex;gap:70px;align-items:center}
.steps.v{grid-template-columns:1fr;flex:1;gap:22px;margin-top:0}
.steps.v .stp{padding:26px 40px}
.qr{text-align:center}
.qr img{width:560px;height:560px;border:3px solid var(--line);border-radius:28px;padding:22px;background:#fff}
.qr p{font-size:38px;font-weight:700;margin:20px 0 0;color:var(--blue)}
/* chrome */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;pointer-events:none}
#bar button{pointer-events:auto;font-family:P;font-size:18px;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:12px;padding:10px 18px;color:var(--ink);cursor:pointer}
#prog{font-family:SG;font-size:18px;color:var(--sub);pointer-events:none}
#menu{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:5}
#menu.on{display:flex}
#menu h3{font-size:30px;margin:0}
#jump{display:grid;grid-template-columns:repeat(10,72px);gap:12px}
#jump button,#menu .row button{font-family:SG;font-weight:700;font-size:24px;height:64px;border:2px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;color:var(--ink)}
#menu .row{display:flex;gap:14px}
#menu .row button{font-family:P;font-size:20px;padding:0 24px}
</style>
</head>

const L = "ABCD";
const GEAR = `<svg class="deco" width="120" height="120" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="#3D5A80" stroke-width="1.8" opacity=".55"><circle cx="18" cy="20" r="6"/><path d="M18 8v4M18 28v4M6 20h4M26 20h4M9.5 11.5l2.8 2.8M23.7 25.7l2.8 2.8M9.5 28.5l2.8-2.8M23.7 14.3l2.8-2.8"/></g><path d="M30 30l9 9" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round"/><circle cx="28.5" cy="28.5" r="3.2" fill="none" stroke="#F2A93B" stroke-width="2.2"/></svg>`;
const stars = n => `<span class="stars">${"★".repeat(n)}<i>${"★".repeat(3-n)}</i></span>`;

// 슬라이드 목록 만들기: 각 슬라이드 = {html, steps, onStep}
const S = [];
S.push({id:"cover", steps:0, html:`<div class="cover">${GEAR}<h1>${D.title.replace(" · ","<br>")}</h1><p>${D.sub}</p></div>
  <div class="hint">화면 터치 · <span class="key">Enter</span> · <span class="key">Space</span> 로 넘겨요</div>`});

function qSlide(q, part, ctx){
  const long = q.opts.some(o => o.length > 16);
  const ai = L.indexOf(q.ans);
  const stem = ctx ? `<div class="ctx">${ctx}</div>`
                   : `<div class="stem">${q.stem.replace("-------", `<span class="blank">${"&nbsp;".repeat(3)}</span>`)}</div>`;
  const opts = `<div class="opts${long?' long':''}">${q.opts.map((o,i)=>`<div class="opt${i===ai?' ans':' dim'}"><b>(${L[i]})</b><span>${o}</span></div>`).join("")}</div>`;
  const exps = q.exp.map(e=>`<div class="ex">${e}</div>`).join("") + `<div class="ex memo">${q.memo}</div>`;
  const fillWord = q.opts[ai];
  return {id:"q"+q.n, n:q.n, steps:1+q.exp.length+1, fill:fillWord,
    html:`${GEAR}<div class="top"><span class="tag">PART ${part}</span><span class="qno">${q.n}번</span>${stars(q.lv)}</div>${stem}${opts}<div class="exp">${exps}</div>`};
}
D.p5.forEach(q => S.push(qSlide(q,5)));
D.p6.forEach((p,k) => {
  S.push({id:k===0?"p6":"p6_"+k, steps:0, html:`${GEAR}<div class="top"><span class="tag">PART 6</span><span class="qno">${p.rng}번</span><span style="font-size:36px;color:var(--sub)">먼저 지문 전체를 읽어 봐요</span></div>
    <div class="pas">${p.body.map(b=>`<p>${b}</p>`).join("")}</div>`});
  p.qs.forEach(q => S.push(qSlide(q,6,q.ctx)));
});
S.push({id:"key", steps:0, html:`<h2>정답 한눈에</h2><div class="grid">${D.key.map((a,i)=>`<div class="cell"><span>${i+1}</span><b>${a}</b></div>`).join("")}</div>`});
S.push({id:"end", steps:0, html:`${GEAR}<h2>10교시 · 복습 노트 → 구글폼 테스트</h2>
  <div class="endwrap"><div class="steps v"><div class="stp"><b>① 문법 12개 읽기</b>복습 노트의 초록 예문을 소리 내어 읽기</div>
  <div class="stp"><b>② 단어 + 확인 문제</b>뜻을 가리고 외운 뒤 □에 체크</div>
  <div class="stp hl"><b>③ 구글폼 테스트</b>20문항 중 14개 이상 맞으면 통과! 못 넘으면 복습 후 재도전</div></div>
  ${D.quiz ? `<div class="qr"><img src="${D.quiz.qr}" alt="테스트 QR"><p>태블릿 카메라로 찍어 테스트 시작</p></div>` : ""}</div>`});

const stage = document.getElementById("stage");
S.forEach((s,i)=>{ const d=document.createElement("section"); d.className="slide"; d.innerHTML=s.html; stage.appendChild(d); s.el=d; });
let cur=0, step=0;

function paint(){
  S.forEach((s,i)=>s.el.classList.toggle("on", i===cur));
  const s=S[cur], el=s.el;
  if(s.n){
    el.classList.toggle("reveal", step>=1); el.classList.toggle("explain", step>=2); el.classList.toggle("ctxs", !!el.querySelector(".ctx"));
    const bl=el.querySelector(".blank");
    if(bl){ bl.classList.toggle("fill", step>=1); bl.innerHTML = step>=1 ? s.fill : (el.querySelector(".ctx") ? s.n : "&nbsp;&nbsp;&nbsp;"); }
    el.querySelectorAll(".ex").forEach((x,i)=>x.classList.toggle("show", step>=i+2));
  }
  const qn = s.n ? `${s.n}번 · ` : "";
  document.getElementById("prog").textContent = `${qn}${cur+1} / ${S.length}`;
}
function next(){ const s=S[cur]; if(step < s.steps){ step++; } else if(cur < S.length-1){ cur++; step=0; } paint(); }
function prev(){ if(step>0){ step--; } else if(cur>0){ cur--; step=S[cur].steps; } paint(); }
function go(i){ cur=i; step=0; paint(); menu.classList.remove("on"); }

document.addEventListener("keydown", e=>{
  if(menu.classList.contains("on")){ if(e.key==="Escape") menu.classList.remove("on"); return; }
  if(["Enter"," ","ArrowRight","PageDown","ArrowDown"].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","Backspace","PageUp","ArrowUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==="Home"){ go(0); }
});
stage.parentElement.addEventListener("pointerup", e=>{
  if(e.target.closest("#bar button,#menu")) return;
  next();
});
const menu=document.getElementById("menu");
document.getElementById("bPrev").onclick=e=>{e.stopPropagation();prev();};
document.getElementById("bMenu").onclick=e=>{e.stopPropagation();menu.classList.add("on");};
document.getElementById("bClose").onclick=()=>menu.classList.remove("on");
document.getElementById("bFull").onclick=e=>{e.stopPropagation(); if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen();};
const jump=document.getElementById("jump");
S.forEach((s,i)=>{ if(s.n){ const b=document.createElement("button"); b.textContent=s.n; b.onclick=()=>go(i); jump.appendChild(b);} });
menu.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(S.findIndex(s=>s.id===b.dataset.go)));

function fit(){ const k=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${k})`; }
addEventListener("resize", fit); fit(); paint();
</script>
